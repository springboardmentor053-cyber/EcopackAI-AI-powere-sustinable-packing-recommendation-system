<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoPackAI | History</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>


*{font-family:Poppins}

body{
    background:radial-gradient(circle at top,#0f2a36,#09161e);
    color:#e0f2f1;
}

/* HEADER */

.header{
    padding:25px 40px;
    background:rgba(5,13,19,.9);
    border-bottom:1px solid rgba(38,166,154,.25);
}

.brand{
    font-size:1.8rem;
    font-weight:800;
    background:linear-gradient(90deg,#1de9b6,#26a69a);
    background-clip:text;
    -webkit-background-clip:text;
    color:transparent;
}

/* ACCORDION */

.acc-item{
    background:linear-gradient(160deg,#0f2933,#0a1d26);
    border:1px solid rgba(38,166,154,.25);
    border-radius:16px;
    margin-bottom:14px;
    overflow:hidden;
}

.acc-header{
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:600;
}

.acc-header:hover{
    background:rgba(38,166,154,.08);
}

.acc-title{
    cursor:pointer;
}

.acc-body{
    max-height:0;
    overflow:hidden;
    transition:.35s ease;
}

.acc-body.open{
    max-height:900px;
    padding:18px 22px 22px;
}

/* OUTPUT ROW */

.output-row{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    text-align:center;
    border-top:1px solid rgba(38,166,154,.2);
    margin-top:12px;
    padding-top:12px;
}

.output-row b{
    color:#7ddfd3;
}

/* ARROW */

.arrow{
    transition:.3s;
}

.arrow.rotate{
    transform:rotate(180deg);
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header d-flex justify-content-between align-items-center">
    <div class="brand">🌿 EcoPackAI</div>

    <a href="dashboard.html" class="btn btn-outline-info">
        ⬅ Back to Dashboard
    </a>
</div>

<!-- CONTENT -->

<div class="container mt-5">

<h3 class="mb-3">📜 Recommendation History</h3>

<button id="compareBtn"
        class="btn btn-outline-warning mb-4"
        disabled
        onclick="compareRuns()">
⚖ Compare Selected (0)
</button>

<div id="historyAccordion"></div>

</div>

<!--  MODAL  -->

<div class="modal fade" id="compareModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content bg-dark text-light">

      <div class="modal-header">
        <h5 class="modal-title">📊 Compare Two Runs</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body" id="compareBody"></div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let selectedRuns = [];

/*  LOAD HISTORY  */

fetch("http://127.0.0.1:5000/history")
.then(res => res.json())
.then(data => {

  const container = document.getElementById("historyAccordion");
  container.innerHTML = "";

  data.forEach((row, i) => {

    container.innerHTML += `
    <div class="acc-item">

      <div class="acc-header">

        <input type="checkbox"
               class="form-check-input me-3"
               onchange="toggleSelect(${row.id}, this)">

        <div class="acc-title" onclick="toggleAcc(${i})">
          📦 ${row.product_name || "Unknown Product"}
        </div>

        <div class="d-flex align-items-center gap-3">

          <button class="btn btn-sm btn-outline-danger"
          onclick="deleteRun(${row.id}, event)">
          🗑 Delete
          </button>

        <span id="arrow-${i}" class="arrow">⌄</span>

        </div>


      </div>

      <div id="body-${i}" class="acc-body">

        <h6>📥 Inputs</h6>
        <p><b>Product:</b> ${row.product_name}</p>
        <p><b>Quantity:</b> ${row.quantity}</p>
        <p><b>Baseline CO₂:</b> ${row.baseline_co2}</p>

        <hr>

        <h6>📤 Output</h6>

        <div class="output-row">
          <div><b>Material</b><br>${row.top_material}</div>
          <div><b>Unit Cost</b><br>₹${Number(row.unit_cost).toFixed(2)}</div>
          <div><b>Total Cost</b><br>₹${Number(row.total_cost).toFixed(2)}</div>
          <div><b>AI Score</b><br>${Number(row.ai_score).toFixed(2)}</div>
          <div><b>Reduction %</b><br>${Number(row.co2_reduction_percent).toFixed(2)}%</div>
        </div>

        <p class="mt-3 text-muted">🕒 ${row.created_at}</p>

      </div>

    </div>
    `;
  });

});

/*  ACCORDION  */

function toggleAcc(i){

  const body = document.getElementById("body-"+i);
  const arrow = document.getElementById("arrow-"+i);

  body.classList.toggle("open");
  arrow.classList.toggle("rotate");
}

/*  SELECTION  */

function toggleSelect(id, cb){

  if(cb.checked){

    if(selectedRuns.length >= 2){
      alert("Only two runs can be compared.");
      cb.checked = false;
      return;
    }

    selectedRuns.push(id);

  }else{
    selectedRuns = selectedRuns.filter(x => x !== id);
  }

  updateCompareBtn();
}

function updateCompareBtn(){

  const btn = document.getElementById("compareBtn");

  btn.innerText = `⚖ Compare Selected (${selectedRuns.length})`;
  btn.disabled = selectedRuns.length !== 2;
}

/*  COMPARE  */

function compareRuns(){

fetch(`http://127.0.0.1:5000/history/compare?id=${selectedRuns[0]}&id=${selectedRuns[1]}`)
.then(r => r.json())
.then(data => {

  renderComparison(data);

  const modal = new bootstrap.Modal(
    document.getElementById("compareModal")
  );

  modal.show();
});
}

function renderComparison(rows){

const a = rows[0];
const b = rows[1];

compareBody.innerHTML = `
<table class="table table-dark table-bordered text-center">

<tr>
<th>Metric</th>
<th>${a.product_name}</th>
<th>${b.product_name}</th>
</tr>

<tr><td>Total Cost</td><td>₹${a.total_cost}</td><td>₹${b.total_cost}</td></tr>
<tr><td>Predicted CO₂</td><td>${a.predicted_co2}</td><td>${b.predicted_co2}</td></tr>
<tr><td>Reduction %</td><td>${a.co2_reduction_percent}%</td><td>${b.co2_reduction_percent}%</td></tr>
<tr><td>AI Score</td><td>${a.ai_score}</td><td>${b.ai_score}</td></tr>
<tr><td>Top Material</td><td>${a.top_material}</td><td>${b.top_material}</td></tr>
<tr><td>Quantity</td><td>${a.quantity}</td><td>${b.quantity}</td></tr>
<tr><td>Date</td><td>${a.created_at}</td><td>${b.created_at}</td></tr>

</table>
`;
}

function deleteRun(id, e){

e.stopPropagation();

if(!confirm("Delete this history entry permanently?")) return;

fetch(`http://127.0.0.1:5000/history/${id}`,{
method:"DELETE"
})
.then(r => r.json())
.then(res => {

if(res.success){
  alert("Deleted successfully ✅");
  location.reload();
}else{
  alert(res.error || "Delete failed");
}

});
}

</script>

</body>
</html>
