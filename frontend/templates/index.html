<!DOCTYPE html>
<html lang="en">
<head>
    <title>EcoPackAI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-2">
        🌱 EcoPackAI
    </h2>
    <p class="text-center text-muted mb-4">
        AI-powered Sustainable Packaging Recommendation
    </p>

    <!-- Input Form -->
    <div class="card p-4 shadow-sm mb-4">

        <h5 class="mb-3">Product Parameters</h5>

        <form id="recommendForm">

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">Strength</label>
                    <input type="number" id="strength" class="form-control" value="45">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Weight Capacity</label>
                    <input type="number" id="weight_capacity" class="form-control" value="8">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Fragility Level</label>
                    <select id="fragility_level" class="form-select">
                        <option value="1">Low</option>
                        <option value="2">Medium</option>
                        <option value="3">High</option>
                    </select>
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-4">
                    <label class="form-label">Biodegradability Score</label>
                    <input type="number" step="0.01" id="bio_score" class="form-control" value="0.9">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Recyclability %</label>
                    <input type="number" id="recycle_score" class="form-control" value="85">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Shipping Type</label>
                    <select id="shipping_type" class="form-select">
                        <option value="ground">Ground</option>
                        <option value="air">Air</option>
                    </select>
                </div>

            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success px-4">
                    Get Recommendation
                </button>
            </div>

        </form>
    </div>

    <!-- Results -->
    <div class="card p-4 shadow-sm">

        <h5 class="mb-3">Recommended Materials</h5>

        <table class="table table-hover" id="resultTable">
            <thead class="table-success">
                <tr>
                    <th>Material</th>
                    <th>Predicted Cost</th>
                    <th>CO₂ Impact</th>
                    <th>Rank Score</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

    </div>

</div>

<script src="/static/js/app.js"></script>

</body>
</html>
