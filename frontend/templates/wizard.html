<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>EcoPackAI • Packaging Input Wizard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/css/theme.css" rel="stylesheet">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">EcoPackAI</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link text-white-50" href="/">Home</a></li>
        <li class="nav-item ms-lg-2">
          <a class="btn btn-eco btn-sm" href="/wizard">New Project</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container py-5">
  <div class="row g-3">
    <!-- Form (full width) -->
    <div class="col-lg-12">
      <div class="card p-4 h-100">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div>
            <h2 class="fw-bold mb-1">Packaging Input Wizard</h2>
            <div class="small-muted">
              Optimize packaging using AI-driven cost, CO₂, and sustainability scoring.
            </div>
          </div>

          <div class="text-end">
            <span class="badge badge-eco">Step 1 of 1</span>
          </div>
        </div>

        <div class="mt-4">
          <div class="d-flex justify-content-between small-muted">
            <span>Configuration progress</span>
            <span id="progressText">0% complete</span>
          </div>
          <div class="progress mt-2">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
          </div>
        </div>

        <form id="wizardForm" class="mt-4">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Product Name <span class="text-danger">*</span></label>
              <input id="product_name" class="form-control" placeholder="e.g., Smartphone" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Product Category</label>
              <input id="product_category" class="form-control" placeholder="e.g., Electronics">
            </div>

            <div class="col-md-4">
              <label class="form-label">Weight (kg)</label>
              <input id="product_weight_kg" type="number" step="0.01" class="form-control" value="0.22">
            </div>

            <div class="col-md-4">
              <label class="form-label">Fragility Level</label>
              <select id="fragility_level" class="form-select">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">Temperature Sensitive</label>
              <select id="temperature_sensitive" class="form-select">
                <option selected>No</option>
                <option>Yes</option>
              </select>
            </div>

            <div class="col-12">
              <div class="card p-3" style="background:rgba(255,255,255,.03); border-radius:14px;">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div class="fw-semibold">Optimization Priorities</div>
                  <span class="badge badge-eco">What-If Analysis</span>
                </div>

                <div class="row g-3 mt-2">
                  <div class="col-md-4">
                    <label class="form-label mb-1">Cost Priority: <span id="wCost">50</span>%</label>
                    <input id="priority_cost" type="range" class="form-range" min="0" max="100" value="50">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label mb-1">Sustainability Priority: <span id="wEco">50</span>%</label>
                    <input id="priority_eco" type="range" class="form-range" min="0" max="100" value="50">
                  </div>
                  <div class="col-md-4">
                    <label class="form-label mb-1">Durability Priority: <span id="wDur">50</span>%</label>
                    <input id="priority_dur" type="range" class="form-range" min="0" max="100" value="50">
                  </div>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <label class="form-label">Required Strength (1–10)</label>
              <input id="required_strength_score" type="number" min="1" max="10" class="form-control" value="7">
            </div>

            <div class="col-md-4">
              <label class="form-label">Preferred Biodegradability (1–10)</label>
              <input id="preferred_biodegradability_score" type="number" min="1" max="10" class="form-control" value="8">
            </div>

            <div class="col-md-4">
              <label class="form-label">Max Packaging Cost (INR)</label>
              <input id="max_packaging_cost_inr" type="number" min="1" class="form-control" value="100">
            </div>

            <div class="col-12 d-flex gap-2 flex-wrap mt-2">
              <button class="btn btn-eco" type="submit">Generate Recommendations</button>
              <button class="btn btn-ghost" type="reset" id="resetBtn">Reset</button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <!-- AI Insights panel removed intentionally (will be shown only after results are generated) -->
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/advanced.js"></script>
</body>
</html>
