<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EcoPackAI | AI Packaging Intelligence</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { font-family: 'Poppins', sans-serif; }

body {
    background: radial-gradient(circle at top, #0f2a36, #09161e);
    color: #e0f2f1;
    min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
    background: linear-gradient(180deg, #0b2430, #071821);
    padding: 30px;
    height: 100vh;
    border-right: 2px solid rgba(38,166,154,0.25);
}

/* INPUTS */
.sidebar input,
.sidebar select {
    background-color: #0f2933;
    border: 1px solid #2a5a61;
    color: #e0f2f1;
}

.sidebar input::placeholder {
    color: #9fbfc0;
}

/* BUTTON */
.btn-ai {
    background: linear-gradient(135deg,#26a69a,#1de9b6);
    border: none;
    font-weight: 600;
}

.btn-ai:hover {
    box-shadow: 0 0 15px rgba(38,166,154,0.7);
}

/* DASHBOARD */
.dashboard {
    padding: 35px;
}

/* CARDS */
.card {
    background: linear-gradient(160deg,#0f2933,#0a1d26);
    border-radius: 16px;
    border: 1px solid rgba(38,166,154,0.25);
    box-shadow: 0 12px 35px rgba(0,0,0,0.6);
}

/* 🔥 FIX: SUMMARY VALUES */
.card h4 {
    color: #e0fff9 !important;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(38,166,154,0.6);
}

.card h6 {
    color:#7ddfd3;
    opacity:.9;
}

/* TABLE */
.table {
    color:#e0f2f1;
}

.table thead {
    background:#081821;
}

.table th {
    color:#7ddfd3;
    border-color:#16414a;
}

.table td {
    border-color:#16414a;
}

/* CHARTS */
canvas {
    max-height:260px;
    background:#071821;
    border-radius:12px;
    padding:10px;
}
</style>
</head>

<body>

<div class="container-fluid">
<div class="row">

<!-- ================= LEFT PANEL ================= -->
<div class="col-md-3 sidebar">

<h3>🌿 EcoPackAI</h3>
<p>AI-Powered Sustainable Packaging</p>
<hr>

<label>Product Name</label>
<input id="product_name" class="form-control mb-2" placeholder="e.g. Electronics Box">

<label>Quantity</label>
<input id="quantity" type="number" class="form-control mb-2" value="500">

<label>Strength Requirement</label>
<select id="strength" class="form-select mb-2">
    <option value="3">Low</option>
    <option value="6">Medium</option>
    <option value="9" selected>High</option>
</select>

<label>Weight Capacity</label>
<input id="weight_capacity" type="number" class="form-control mb-2" value="10">

<label>Biodegradability (1–10)</label>
<input id="biodegradability" type="number" class="form-control mb-2" value="6">

<label>Recyclability (%)</label>
<input id="recyclability" type="number" class="form-control mb-2" value="60">

<label>Cost Efficiency (0–1)</label>
<input id="cost_efficiency" type="number" step="0.1" class="form-control mb-3" value="0.9">

<button class="btn btn-ai w-100" onclick="getAIRecommendation()">🚀 Run AI Analysis</button>

</div>

<!-- ================= DASHBOARD ================= -->
<div class="col-md-9 dashboard">

<h4 class="mb-4">📊 EcoPackAI Recommendation Dashboard</h4>

<!-- SUMMARY -->
<div class="row mb-4">

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Top Material</h6>
<h4 id="topMaterial">–</h4>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Total Cost</h6>
<h4 id="topCost">–</h4>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>AI Score</h6>
<h4 id="topScore">–</h4>
</div>
</div>

<div class="col-md-3">
<div class="card p-3 text-center">
<h6>Predicted CO₂</h6>
<h4 id="co2Value">–</h4>
</div>
</div>

</div>

<!-- TABLE -->
<div class="card p-3 mb-4">
<h5>🏆 Top Recommended Materials</h5>

<table class="table text-center">
<thead>
<tr>
<th>#</th>
<th>Material</th>
<th>Unit Cost</th>
<th>Total Cost</th>
<th>AI Score</th>
</tr>
</thead>
<tbody id="resultTable"></tbody>
</table>
</div>

<!-- CHARTS -->
<div class="row">

<div class="col-md-6">
<div class="card p-3">
<h6>💰 Cost Comparison</h6>
<canvas id="costChart"></canvas>
</div>
</div>

<div class="col-md-6">
<div class="card p-3">
<h6>🤖 AI Score Comparison</h6>
<canvas id="scoreChart"></canvas>
</div>
</div>

</div>

</div>
</div>
</div>

<script>
let costChart, scoreChart;

function getAIRecommendation() {

const payload = {
    product_name: product_name.value,
    selected_material: null,
    quantity: Number(quantity.value),
    strength_encoded: Number(strength.value),
    weight_capacity: Number(weight_capacity.value),
    biodegradability_score: Number(biodegradability.value),
    recyclability_percent: Number(recyclability.value),
    cost_efficiency_score: Number(cost_efficiency.value)
};

fetch("http://127.0.0.1:5000/recommend", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(payload)
})
.then(res => res.json())
.then(result => {

console.log("API RESULT:", result);

if (!result.recommendations || result.recommendations.length === 0) {
    alert("No materials matched your criteria.");
    return;
}

const recs = result.recommendations;

topMaterial.innerText = recs[0].material_name;
topCost.innerText = "₹" + recs[0].total_cost.toFixed(2);
topScore.innerText = recs[0].ai_recommendation_score.toFixed(2);
co2Value.innerText = result.predicted_co2;

resultTable.innerHTML = "";

const labels = [], costs = [], scores = [];

recs.forEach((r, i) => {
labels.push(r.material_name);
costs.push(r.total_cost);
scores.push(r.ai_recommendation_score);

resultTable.innerHTML += `
<tr>
<td>${i+1}</td>
<td>${r.material_name}</td>
<td>₹${r.predicted_unit_cost.toFixed(2)}</td>
<td>₹${r.total_cost.toFixed(2)}</td>
<td>${r.ai_recommendation_score.toFixed(2)}</td>
</tr>`;
});

if (costChart) costChart.destroy();
if (scoreChart) scoreChart.destroy();

costChart = new Chart(document.getElementById("costChart"), {
type:"bar",
data:{labels,datasets:[{label:"Total Cost",data:costs}]}
});

scoreChart = new Chart(document.getElementById("scoreChart"), {
type:"line",
data:{labels,datasets:[{label:"AI Score",data:scores}]}
});

});
}
</script>

</body>
</html>
