<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EcoPackAI – Material Recommendation</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            font-family: "Segoe UI", sans-serif;
        }

        .app-header {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            border: none;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-success {
            font-size: 18px;
            padding: 10px;
            border-radius: 10px;
        }

        .result-box span {
            font-weight: bold;
            color: #2e7d32;
        }

        #materials li {
            background: #f1f8e9;
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container mt-4 mb-5">

    <!-- Header -->
    <div class="app-header mb-4">
        <h2><i class="bi bi-recycle"></i> EcoPackAI</h2>
        <p class="mb-0">AI-Powered Sustainable Packaging Recommendation System</p>
    </div>

    <!-- Input Form -->
    <div class="card p-4">
        <h5 class="mb-3"><i class="bi bi-pencil-square"></i> Product & Material Inputs</h5>
        <div class="row g-3">

            <div class="col-md-6">
                <label class="form-label">Weight Capacity Score (1–10)</label>
                <input type="number" id="weight_capacity_score" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Strength Score (1–10)</label>
                <input type="number" id="strength_score" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Barrier Score (1–10)</label>
                <input type="number" id="barrier_score" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Reuse Potential Score (1–10)</label>
                <input type="number" id="reuse_potential_score" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Material Strength (1–10)</label>
                <input type="number" id="material_strength" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Biodegradability (0–1)</label>
                <input type="number" step="0.1" id="biodegradability" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Recyclability Percent (0–100)</label>
                <input type="number" id="recyclability_percent" class="form-control">
            </div>

        </div>

        <button class="btn btn-success mt-4 w-100" onclick="predict()">
            <i class="bi bi-lightning-charge"></i> Predict Sustainable Material
        </button>
    </div>

    <!-- Results -->
    <div class="card p-4 mt-4 result-box">
        <h5><i class="bi bi-graph-up"></i> Prediction Results</h5>
        <p>Predicted Cost: <span id="predicted_cost">-</span></p>
        <p>Predicted CO₂: <span id="predicted_co2">-</span></p>

        <hr>
        <h5><i class="bi bi-award"></i> Top Recommended Materials</h5>
        <ul id="materials"></ul>
    </div>

    <!-- Charts -->
    <div class="card p-4 mt-4">
        <h5><i class="bi bi-bar-chart"></i> Material Comparison Dashboard</h5>
        <canvas id="co2Chart" height="120"></canvas>
        <canvas id="costChart" height="120" class="mt-4"></canvas>
    </div>

</div>

<script>
function predict() {
    const data = {
        weight_capacity_score: Number(document.getElementById("weight_capacity_score").value),
        strength_score: Number(document.getElementById("strength_score").value),
        barrier_score: Number(document.getElementById("barrier_score").value),
        reuse_potential_score: Number(document.getElementById("reuse_potential_score").value),
        material_strength: Number(document.getElementById("material_strength").value),
        biodegradability: Number(document.getElementById("biodegradability").value),
        recyclability_percent: Number(document.getElementById("recyclability_percent").value)
    };

    fetch("http://127.0.0.1:8000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        document.getElementById("predicted_cost").innerText = result.predicted_cost;
        document.getElementById("predicted_co2").innerText = result.predicted_co2;

        const list = document.getElementById("materials");
        list.innerHTML = "";

        const names = [], co2 = [], cost = [];

        result.recommended_materials.forEach(item => {
            const li = document.createElement("li");
            li.innerText = item.material_name + " (Score: " + item.material_score + ")";
            list.appendChild(li);

            names.push(item.material_name);
            co2.push(item.co2_emission_score);
            cost.push(item.material_score);
        });

        new Chart(co2Chart, {
            type: "bar",
            data: { labels: names, datasets: [{ label: "CO₂ Emission", data: co2, backgroundColor: "#66bb6a" }] }
        });

        new Chart(costChart, {
            type: "bar",
            data: { labels: names, datasets: [{ label: "Cost Score", data: cost, backgroundColor: "#ffa726" }] }
        });
    })
    .catch(err => alert("Error connecting to backend"));
}
</script>

</body>
</html>
