<!DOCTYPE html>
<html>
<head>
    <title>EcoPackAI</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>🌱 EcoPackAI</h1>
    <p class="subtitle">AI-Driven Sustainable Packaging Recommendation System</p>

    <div class="card">
        <h3>Material Requirement Inputs</h3>

        <div class="grid">
            <select id="category">
                <option>Food</option>
                <option>Electronics</option>
                <option>Cosmetics</option>
            </select>

            <input type="number" id="weight" placeholder="Weight (kg)" value="1">

            <select id="fragility">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
            </select>

            <input type="number" id="budget" placeholder="Budget ₹" value="15">

            <select id="eco">
                <option>Low</option>
                <option selected>High</option>
            </select>

            <input type="number" id="count" placeholder="Recommendations" value="5">
        </div>

        <button onclick="run()">Run Recommendation Engine</button>
    </div>

    <div class="card">
        <h3>Recommendations</h3>
        <table>
            <thead>
                <tr>
                    <th>Material</th>
                    <th>Suitability</th>
                    <th>Cost (₹)</th>
                    <th>CO₂</th>
                </tr>
            </thead>
            <tbody id="output"></tbody>
        </table>
    </div>

    <div class="card">
        <h3>Comparison Charts</h3>
        <canvas id="costChart"></canvas>
        <canvas id="co2Chart"></canvas>
    </div>
</div>

<script>
let costChart, co2Chart;

function run() {
    fetch("/api/recommend", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            product_category: category.value,
            weight: weight.value,
            fragility: fragility.value,
            budget: budget.value,
            eco_priority: eco.value,
            recommendations: count.value
        })
    })
    .then(res => res.json())
    .then(data => {
        output.innerHTML = "";

        let labels = [], costs = [], co2s = [];

        data.forEach(d => {
            labels.push(d.material);
            costs.push(d.cost);
            co2s.push(d.co2);

            output.innerHTML += `
                <tr>
                    <td>${d.material}</td>
                    <td>${d.suitability}</td>
                    <td>₹ ${d.cost}</td>
                    <td>${d.co2}</td>
                </tr>`;
        });

        drawCharts(labels, costs, co2s);
    });
}

function drawCharts(labels, costs, co2s) {
    if (costChart) costChart.destroy();
    if (co2Chart) co2Chart.destroy();

    costChart = new Chart(document.getElementById("costChart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "Cost (₹)",
                data: costs,
                backgroundColor: "#4CAF50"
            }]
        }
    });

    co2Chart = new Chart(document.getElementById("co2Chart"), {
        type: "line",
        data: {
            labels: labels,
            datasets: [{
                label: "CO₂ Emissions",
                data: co2s,
                borderColor: "#FF5722",
                fill: false
            }]
        }
    });
}
</script>

</body>
</html>
