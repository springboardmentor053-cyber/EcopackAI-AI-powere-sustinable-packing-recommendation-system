<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EcoPackAI • Materials</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <h2>EcoPackAI</h2>
      <p>AI Packaging</p>
    </div>

    <nav class="nav">
      <a class="nav-item" href="/">🏠 Recommendation</a>
      <a class="nav-item active" href="/materials">📦 Materials DB</a>
      <a class="nav-item" href="/dashboard">📊 Dashboard</a>
    </nav>

    <div class="sidebar-footer">
      Eco-friendly Decision Tool
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <div class="topbar">
      <h1>Materials Database</h1>
      <input type="text" id="searchInput" class="search-box" placeholder="Search material...">
    </div>

    <!-- STATS ROW -->
    <div class="material-stats">
      <div class="stat-card">
        <h3 id="totalCount">0</h3>
        <p>Total Materials</p>
      </div>

      <div class="stat-card">
        <h3 id="avgStrength">--</h3>
        <p>Avg Strength</p>
      </div>

      <div class="stat-card">
        <h3 id="avgCost">--</h3>
        <p>Avg Cost</p>
      </div>

      <div class="stat-card">
        <h3 id="avgRecycle">--%</h3>
        <p>Avg Recyclability</p>
      </div>
    </div>

    <!-- MATERIAL CARDS GRID -->
    <div class="materials-grid" id="materialsGrid">
      <!-- Cards injected by JS -->
    </div>

  </main>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

  const grid = document.getElementById("materialsGrid");
  const searchInput = document.getElementById("searchInput");

  try {
    const res = await fetch("/api/materials");
    const data = await res.json();

    const materials = data.materials;

    document.getElementById("totalCount").textContent = materials.length;

    const avgStrength = materials.reduce((a,b)=>a+b.strength_mpa,0)/materials.length;
    const avgCost = materials.reduce((a,b)=>a+b.cost_inr_per_kg,0)/materials.length;
    const avgRecycle = materials.reduce((a,b)=>a+b.recyclability_pct,0)/materials.length;

    document.getElementById("avgStrength").textContent = avgStrength.toFixed(1);
    document.getElementById("avgCost").textContent = "₹ " + avgCost.toFixed(1);
    document.getElementById("avgRecycle").textContent = avgRecycle.toFixed(1) + "%";

    function renderCards(filter="") {
      grid.innerHTML = "";

      materials
        .filter(m => m.material_type.toLowerCase().includes(filter.toLowerCase()))
        .forEach(m => {

          const card = document.createElement("div");
          card.className = "material-card";

          card.innerHTML = `
            <h3>${m.material_type}</h3>

            <div class="card-row">
              <span>Strength</span>
              <b>${m.strength_mpa}</b>
            </div>

            <div class="card-row">
              <span>Cost</span>
              <b>₹ ${m.cost_inr_per_kg}</b>
            </div>

            <div class="card-row">
              <span>Recyclability</span>
              <b>${m.recyclability_pct}%</b>
            </div>

            <div class="progress-bar">
              <div class="progress-fill" style="width:${m.recyclability_pct}%"></div>
            </div>
          `;

          grid.appendChild(card);
        });
    }

    renderCards();

    searchInput.addEventListener("input", e => {
      renderCards(e.target.value);
    });

  } catch (err) {
    grid.innerHTML = "<p>Error loading materials</p>";
    console.error(err);
  }

});
</script>

</body>
</html>
